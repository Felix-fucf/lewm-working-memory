<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img">
<title>V3 representation and semantic probe gates</title>
<desc>Prediction effective rank and final position probe R squared for N1, N2, and N3.</desc>
