<text x="179.0" y="513" text-anchor="middle" font-size="15" font-weight="600">N1</text>
<rect x="280" y="156.8" width="88" height="328.2" fill="#4C78A8"/>
<text x="324.0" y="148.8" text-anchor="middle" font-size="14">67.3</text>
<text x="324.0" y="513" text-anchor="middle" font-size="15" font-weight="600">N2</text>
<rect x="425" y="167.0" width="88" height="318.0" fill="#4C78A8"/>
<text x="469.0" y="159.0" text-anchor="middle" font-size="14">65.2</text>
<text x="469.0" y="513" text-anchor="middle" font-size="15" font-weight="600">N3</text>
<text x="845.0" y="83" text-anchor="middle" font-size="17" font-weight="600">Final position probe R²</text>
