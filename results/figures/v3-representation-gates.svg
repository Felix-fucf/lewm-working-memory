<line x1="610" y1="165.9" x2="1080" y2="165.9" stroke="#5f6368"/>
<text x="600" y="170.9" text-anchor="end" font-size="13">0.0</text>
<rect x="661" y="165.9" width="34" height="214.2" fill="#F58518"/>
<text x="678" y="397.1" text-anchor="middle" font-size="11">-0.30</text>
